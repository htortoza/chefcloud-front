<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  appendTo="body"
  header="Horarios"
  [style]="{ width: '30rem' }"
  (onHide)="cerrar.emit()"
>
  <div class="franjas-manager">
    @for (franja of franjas(); track franja.id) {
      <div class="franjas-manager__tarjeta">
        <div class="franjas-manager__cabecera">
          @if (esGeneral(franja.id)) {
            <span class="franjas-manager__nombre-fijo">{{ franja.nombre }}</span>
          } @else {
            <app-editable-text-field class="franjas-manager__nombre" [valor]="franja.nombre" [requerido]="true" (guardar)="renombrar(franja.id, $event)" />
          }

          <div class="franjas-manager__acciones">
            <p-toggleswitch
              class="franjas-manager__toggle"
              [ngModel]="tieneHorario(franja)"
              [disabled]="esGeneral(franja.id)"
              [attr.aria-label]="tieneHorario(franja) ? 'Quitar horario personalizado' : 'Usar horario personalizado'"
              (ngModelChange)="toggleHorarioPersonalizado(franja.id, $event)"
            />
            @if (!esGeneral(franja.id)) {
              <button type="button" class="franjas-manager__eliminar" aria-label="Eliminar franja" (click)="eliminar(franja.id)">
                <i class="pi pi-trash"></i>
              </button>
            }
          </div>
        </div>

        @if (tieneHorario(franja)) {
          <div class="franjas-manager__horas">
            <input type="time" pInputText [ngModel]="franja.horaInicio" (ngModelChange)="actualizarHoraInicio(franja.id, $event)" />
            <span class="franjas-manager__horas-separador">–</span>
            <input type="time" pInputText [ngModel]="franja.horaFin" (ngModelChange)="actualizarHoraFin(franja.id, $event)" />
          </div>
        } @else {
          <span class="franjas-manager__todo-dia">Vigente todo el día</span>
        }
      </div>
    }

    <button type="button" class="franjas-manager__nueva" (click)="agregarFranja()">
      <i class="pi pi-plus" aria-hidden="true"></i>
      <span>Nueva franja</span>
    </button>
  </div>

  <ng-template pTemplate="footer">
    <p-button label="Cerrar" [text]="true" (onClick)="cerrarDialog()" />
  </ng-template>
</p-dialog>
