@if (editando()) {
  <div class="editable-text-field editable-text-field--editando">
    <input
      #input
      pInputText
      type="text"
      class="editable-text-field__input"
      [ngModel]="borrador()"
      (ngModelChange)="borrador.set($event)"
      (keydown.enter)="confirmar()"
      (blur)="confirmar()"
    />
    <p-button icon="pi pi-check" [text]="true" severity="secondary" size="small" aria-label="Guardar" (onClick)="confirmar()" />
  </div>
} @else {
  <div class="editable-text-field" (click)="iniciarEdicion()">
    <span class="editable-text-field__valor">{{ valor() }}</span>
    <p-button icon="pi pi-pencil" [text]="true" severity="secondary" size="small" aria-label="Editar" (onClick)="iniciarEdicion()" />
  </div>
}
