<p-toast [baseZIndex]="9999" />
<p-confirmDialog [style]="{ maxWidth: '28rem' }" />

<div class="shell">
  @if (mostrarSidebar()) {
  <aside class="shell-nav">
    <div class="marca-activa">
      <span class="marca-activa__nombre">{{ marcaContextService.marcaActiva().nombre }}</span>
      <span class="marca-activa__dominio">{{ marcaContextService.marcaActiva().dominio }}</span>
    </div>

    <nav class="modulos-lista">
      @for (item of itemsNavegacion; track item.clave) {
        @if (item.implementado) {
          <a [routerLink]="item.ruta" routerLinkActive="submodulo-activo" class="submodulo-item">
            <i class="submodulo-item__icono" [class]="item.icono"></i>
            <span class="submodulo-item__etiqueta">{{ item.etiqueta }}</span>
          </a>
        } @else {
          <span class="submodulo-item submodulo-item--deshabilitado">
            <i class="submodulo-item__icono" [class]="item.icono"></i>
            <span class="submodulo-item__etiqueta">{{ item.etiqueta }}</span>
            <span class="submodulo-etiqueta-estado">Próximamente</span>
          </span>
        }
      }
    </nav>

    <div class="shell-nav__pie">
      <app-sesion-switcher />

      <button type="button" class="submodulo-item shell-nav__cuenta-boton" (click)="menuCuenta.toggle($event)" aria-label="Configuración de cuenta">
        <span class="submodulo-item__icono"><i class="pi pi-cog"></i></span>
        <span class="submodulo-item__etiqueta">Ajustes</span>
      </button>
      <p-menu #menuCuenta [model]="itemsMenuCuenta" [popup]="true" appendTo="body" />
    </div>
  </aside>
  }

  <main class="shell-contenido" [class.shell-contenido--con-padding]="mostrarSidebar()">
    <router-outlet />
  </main>
</div>
